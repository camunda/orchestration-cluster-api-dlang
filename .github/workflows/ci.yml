name: CI

on:
  pull_request:
  push:
    branches: [main, 'stable/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub test && dub test :runtime
      - run: dub build -b release && dub build -b release :runtime

  lint:
    name: D-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: ./scripts/check-safe.sh
      - run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini source runtime/source

  generate:
    name: Generation is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Generator parser unittests
        run: dub run -q --build=unittest --single scripts/generate.d -- --DRT-testmode=test-only
      - run: dub run -q --single scripts/generate.d
      - name: Fail if generated sources, docs or examples drifted
        run: git diff --exit-code -- source/camunda/generated docs examples
      - name: README snippets are in sync
        run: dub run -q --single scripts/sync-readme-snippets.d -- --check
      - name: Configuration reference is in sync
        run: dub run -q --single scripts/generate-config-reference.d -- --check
      - name: Example coverage is complete
        run: dub run -q --single scripts/check-example-coverage.d
      - name: Docusaurus markdown
        run: dub run -q --single scripts/generate-docusaurus-md.d -- --validate-links
