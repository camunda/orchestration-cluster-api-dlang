name: CI

on:
  pull_request:
  push:
    branches: [main, 'stable/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub test && dub test :runtime && dub test :openapi
      - run: dub build -b release && dub build -b release :runtime && dub build -b release :openapi

  lint:
    name: D-Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - run: ./scripts/check-safe.sh
      - name: Windows code compiles (cross type-check)
        run: make typecheck-windows
      - run: dub run -q dscanner@0.16.0-beta.5 -- --styleCheck --config dscanner.ini source runtime/source openapi/source

  generate:
    name: Generation is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Generator parser unittests
        run: dub run -q --build=unittest --single scripts/generate.d -- --DRT-testmode=test-only
      - run: dub run -q --single scripts/generate.d
      - name: Fail if generated sources, docs or examples drifted
        run: git diff --exit-code -- source/camunda/generated docs examples ':(exclude)examples/readme.d' ':(exclude)examples/topology.d'
      - name: README snippets are in sync
        run: dub run -q --single scripts/sync-readme-snippets.d -- --check
      - name: Configuration reference is in sync
        run: dub run -q --single scripts/generate-config-reference.d -- --check
      - name: Example coverage is complete
        run: dub run -q --single scripts/check-example-coverage.d
      - name: Docusaurus markdown
        run: dub run -q --single scripts/generate-docusaurus-md.d -- --validate-links

  commitlint:
    name: Commit messages
    # The commit-range linter is meaningful on pull requests; on direct pushes the
    # before/after range is degenerate, so scope it to PRs. No local config: the
    # shared camunda/sdk-infra commitlint.config.base.cjs applies.
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-commitlint.yml@v1

  # A `BREAKING CHANGE:` footer makes semantic-release cut a new major, which would
  # break the 11.x (main) / 10.x (stable/10) mapping to Camunda 8.11 / 8.10.
  # Bypass with the `breaking-change-approved` label.
  breaking-change-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: camunda/sdk-infra/.github/workflows/sdk-breaking-change-guard.yml@v1
