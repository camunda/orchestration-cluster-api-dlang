name: Publish

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      repair-tag:
        description: >-
          Repair a half-finished release for this tag (e.g. v11.0.0-alpha.4):
          recreate the semantic-release note and/or GitHub Release. Leave
          empty for a normal release run.
        required: false
        type: string
      api_break_approved:
        description: >-
          stable/** only: release even though the public API breaks
          compatibility with the last release of the major (for breaks with
          no PR to label, e.g. from upstream spec drift).
        type: boolean
        default: false

concurrency:
  group: orchestration-cluster-api-dlang-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # The branch's default spec ref lives in package.json (`main` on main,
  # `stable/8.N` on stable/N). A repo variable SPEC_REF_OVERRIDE can point the
  # release at another camunda/camunda ref; the shared guard requires
  # SPEC_REF_OVERRIDE_ACK=true and an unexpired SPEC_REF_OVERRIDE_EXPIRES
  # (YYYY-MM-DD) so a temporary override cannot silently outlive its purpose.
  spec-ref:
    name: Resolve spec ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default-ref: ${{ steps.ref.outputs.default-ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: ref
        run: |
          ref=$(jq -r '.scripts["bundle:spec"]' package.json | grep -oE -- '--ref [^ ]+' | sed -E 's/^--ref \$\{SPEC_REF:-([^}]*)\}$/\1/')
          if [ -z "$ref" ]; then echo "::error::no default SPEC_REF in package.json bundle:spec"; exit 1; fi
          echo "default-ref=$ref" >> "$GITHUB_OUTPUT"

  spec-ref-guard:
    needs: spec-ref
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ vars.SPEC_REF_OVERRIDE || needs.spec-ref.outputs.default-ref }}
      default-ref: ${{ needs.spec-ref.outputs.default-ref }}
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub test && dub test :runtime
      - run: dub build -b release && dub build -b release :runtime

  release:
    name: Version & Publish (${{ github.ref_name }})
    needs: [test, spec-ref-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not allowed in step `if:`; expose presence as a flag.
      HAS_VAULT: ${{ secrets.VAULT_ADDR != '' }}
    steps:
      # Preferred identity: the camunda-sdk-automation app (from Vault), which
      # can push through branch rulesets. Fail open: if Vault is not configured
      # or the app token cannot be minted, fall back to GITHUB_TOKEN (works while
      # main/stable/* carry no rulesets). The run summary says which one ran.
      - name: Import secrets
        id: secrets
        if: env.HAS_VAULT == 'true'
        continue-on-error: true
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        if: steps.secrets.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Report release identity
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Releasing as camunda-sdk-automation (GitHub App via Vault)." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="Vault/app token unavailable (vault=${{ steps.secrets.outcome }}, app=${{ steps.app-token.outcome }}); releasing with GITHUB_TOKEN. Pushes fail if a branch ruleset blocks github-actions."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch remote refs for semantic-release
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/notes/*:refs/notes/*' || true

      - name: Export stable line config
        run: |
          echo "CAMUNDA_SDK_CURRENT_STABLE_MAJOR=${{ vars['CAMUNDA_SDK_CURRENT_STABLE_MAJOR'] }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release tooling
        run: npm install

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      # Same model as the JS SDK: each release re-bundles the spec from
      # camunda/camunda (SPEC_REF default in package.json: main on main,
      # stable/8.N on stable/N), regenerates, and commits any drift as
      # `fix(gen): regenerate artifacts` so upstream API changes ship.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0

      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev

      - name: Bundle spec from upstream and regenerate
        env:
          # Empty unless overridden (and accepted by spec-ref-guard); package.json
          # then falls back to the branch default.
          SPEC_REF: ${{ vars.SPEC_REF_OVERRIDE }}
        run: |
          npm run bundle:spec
          dub run -q --single scripts/generate.d

      - name: Detect generated drift
        id: drift
        run: |
          if git diff --quiet -- external-spec/bundled source/camunda/generated docs examples; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- external-spec/bundled source/camunda/generated docs examples
          fi

      - name: Gate regenerated code
        if: steps.drift.outputs.changed == 'true'
        run: |
          dub run -q --build=unittest --single scripts/generate.d -- --DRT-testmode=test-only
          dub test
          dub test :runtime
          make examples example-coverage sync-readme-check config-reference-check

      - name: Commit generated artifacts
        if: steps.drift.outputs.changed == 'true'
        run: |
          git add external-spec/bundled source/camunda/generated docs examples
          git commit -m "fix(gen): regenerate artifacts"

      # Stable branches must not break customer code that compiled against
      # the last release of the major. This checks the commit about to be
      # tagged, including the regenerated code above that no PR reviewed.
      # Override: the api-break-approved label on a PR merged since that
      # release, or the api_break_approved input of a manual run. A no-op on
      # main, whose prereleases make no compatibility promise.
      - name: API compatibility gate
        if: ${{ github.event.inputs.repair-tag == '' && startsWith(github.ref_name, 'stable/') }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.api_break_approved }}
        run: |
          dub build -q --single scripts/api-compat.d || exit 2
          API_COMPAT="$PWD/scripts/.dub/bin/api-compat" bash scripts/api-compat-release.sh

      - name: Publish (semantic-release)
        if: ${{ github.event.inputs.repair-tag == '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DUB_REGISTRY_TOKEN: ${{ secrets.DUB_REGISTRY_TOKEN }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: npx semantic-release

      # A Publish run can die after semantic-release pushed the release commit
      # and tag but before it created the git note / GitHub Release (seen on
      # v11.0.0-alpha.4: a transient rejection of the notes push). The next run
      # finds the tag and treats the version as released, so repair it here.
      # The script is idempotent, only touches the newest tag reachable from
      # HEAD, and no-ops when HEAD is not the release commit. It still fails
      # the step after a successful repair so the incident stays visible.
      - name: Repair half-finished release
        if: ${{ failure() && github.event.inputs.repair-tag == '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: |
          bash scripts/repair-release.sh
          exit 1

      # Manual repair for a given tag (workflow_dispatch with repair-tag set).
      # The dispatch input is passed through a quoted environment variable, not
      # interpolated into shell source, so a crafted value cannot execute.
      - name: Repair release (manual)
        if: ${{ github.event.inputs.repair-tag != '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
          REPAIR_TAG: ${{ github.event.inputs.repair-tag }}
        run: bash scripts/repair-release.sh "${REPAIR_TAG}"

  notify-release-failure:
    needs: [spec-ref, spec-ref-guard, test, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1
    with:
      repo-name: orchestration-cluster-api-dlang
      workflow-name: Publish
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
