name: Publish

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:

concurrency:
  group: orchestration-cluster-api-dlang-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  test:
    name: dub test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
      - run: dub test && dub test :runtime
      - run: dub build -b release && dub build -b release :runtime

  release:
    name: Version & Publish (${{ github.ref_name }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not allowed in step `if:`; expose presence as a flag.
      HAS_VAULT: ${{ secrets.VAULT_ADDR != '' }}
    steps:
      # Preferred identity: the camunda-sdk-automation app (from Vault), which
      # can push through branch rulesets. Fail open: if Vault is not configured
      # or the app token cannot be minted, fall back to GITHUB_TOKEN (works while
      # main/stable/* carry no rulesets). The run summary says which one ran.
      - name: Import secrets
        id: secrets
        if: env.HAS_VAULT == 'true'
        continue-on-error: true
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        if: steps.secrets.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Report release identity
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Releasing as camunda-sdk-automation (GitHub App via Vault)." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="Vault/app token unavailable (vault=${{ steps.secrets.outcome }}, app=${{ steps.app-token.outcome }}); releasing with GITHUB_TOKEN. Pushes fail if a branch ruleset blocks github-actions."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch remote refs for semantic-release
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git fetch origin '+refs/notes/*:refs/notes/*' || true

      - name: Export stable line config
        run: |
          echo "CAMUNDA_SDK_CURRENT_STABLE_MAJOR=${{ vars['CAMUNDA_SDK_CURRENT_STABLE_MAJOR'] }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release tooling
        run: npm install

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      # Same model as the JS SDK: each release re-bundles the spec from
      # camunda/camunda (SPEC_REF default in package.json: main on main,
      # stable/8.N on stable/N), regenerates, and commits any drift as
      # `fix(gen): regenerate artifacts` so upstream API changes ship.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.43.0

      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev

      - name: Bundle spec from upstream and regenerate
        run: |
          npm run bundle:spec
          dub run -q --single scripts/generate.d

      - name: Detect generated drift
        id: drift
        run: |
          if git diff --quiet -- external-spec/bundled source/camunda/generated docs examples; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- external-spec/bundled source/camunda/generated docs examples
          fi

      - name: Gate regenerated code
        if: steps.drift.outputs.changed == 'true'
        run: |
          dub test
          dub test :runtime
          make examples example-coverage sync-readme-check config-reference-check

      - name: Commit generated artifacts
        if: steps.drift.outputs.changed == 'true'
        run: |
          git add external-spec/bundled source/camunda/generated docs examples
          git commit -m "fix(gen): regenerate artifacts"

      - name: Publish (semantic-release)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DUB_REGISTRY_TOKEN: ${{ secrets.DUB_REGISTRY_TOKEN }}
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: npx semantic-release

  notify-release-failure:
    needs: [test, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1
    with:
      repo-name: orchestration-cluster-api-dlang
      workflow-name: Publish
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
