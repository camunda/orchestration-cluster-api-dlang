# Toolchain for the backport regeneration (sdk-backport.yml), as in ci.yml:
# setup-sdk-toolchain has no D. Read from the backport's TARGET branch.
# No caches: this job runs the backport branch's code.
name: Codegen setup
description: Install LDC + dub (the generator and the build check) and the libcurl headers.
runs:
  using: composite
  steps:
    - uses: dlang-community/setup-dlang@v2
      with:
        compiler: ldc-1.43.0
    - name: Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev zlib1g-dev
