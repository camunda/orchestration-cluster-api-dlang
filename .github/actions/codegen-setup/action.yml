# Toolchain for the backport regeneration (sdk-backport.yml), as in ci.yml:
# setup-sdk-toolchain has no D. Read from the backport's TARGET branch.
# No caches: this job runs the backport branch's code.
name: Codegen setup
description: Install Python (the generator) and LDC + dub (the build check).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: dlang-community/setup-dlang@v2
      with:
        compiler: ldc-1.43.0
